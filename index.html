<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Phonics & Talk Adventure - 兒童自然發音與情境英語大冒險</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --purple: #9D4EDD;
      --blue: #48CAE4;
      --green: #52B788;
      --orange: #FF9F1C;
      --bg: #F0F9FF;
      --card-bg: #FFFFFF;
      --text: #2B2D42;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --border-radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #f3e8ff 100%);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 頂部導航與星星看板 */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 2.2rem;
      animation: bounce 2s infinite ease-in-out;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(45deg, #FF6B6B, #9D4EDD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .score-board {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .star-counter {
      background: var(--accent);
      color: #92400e;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(255, 230, 109, 0.5);
      border: 3px solid #FDE047;
    }

    /* 模式切換標籤頁 */
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px auto 10px;
      width: 90%;
      max-width: 900px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 18px;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 20px;
      background: white;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: var(--shadow);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      transform: scale(1.04);
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
    }

    .tab-btn:nth-child(2).active {
      background: var(--purple);
      box-shadow: 0 8px 20px rgba(157, 78, 221, 0.4);
    }

    .tab-btn:nth-child(3).active {
      background: var(--secondary);
      box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4);
    }

    /* 主要內容區 */
    main {
      flex: 1;
      max-width: 960px;
      width: 92%;
      margin: 10px auto 40px;
      position: relative;
    }

    .panel {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .panel.active {
      display: block;
    }

    /* 卡片公共樣式 */
    .game-card {
      background: white;
      border-radius: var(--border-radius);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
    }

    /* =========================================
       模式 1: 自然發音拼字挑戰 (Phonics Builder)
       ========================================= */
    .level-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .chip-btn {
      padding: 8px 16px;
      border-radius: 30px;
      background: #F1F5F9;
      color: #475569;
      font-weight: 700;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn.active {
      background: #EFF6FF;
      color: #2563EB;
      border-color: #3B82F6;
    }

    .target-image-display {
      font-size: 6rem;
      margin: 10px 0;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1));
      transition: transform 0.3s;
      cursor: pointer;
    }

    .target-image-display:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .phonics-hint {
      font-size: 1.25rem;
      color: #64748B;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sound-btn {
      background: #FEE2E2;
      color: #EF4444;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.2s;
    }

    .sound-btn:hover {
      transform: scale(1.15);
      background: #FECACA;
    }

    /* 拼字格子槽 */
    .spell-slots {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 24px 0 32px;
    }

    .slot {
      width: 76px;
      height: 84px;
      border: 4px dashed #CBD5E1;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 900;
      color: #1E293B;
      background: #F8FAFC;
      transition: all 0.3s;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--primary);
      background: #FFF1F2;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 候選字母積木 */
    .letter-blocks {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .letter-tile {
      width: 68px;
      height: 74px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      border: 3px solid #E2E8F0;
      border-bottom: 7px solid #CBD5E1;
      border-radius: 18px;
      font-size: 2.2rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease-out;
    }

    .letter-tile:hover {
      transform: translateY(-4px);
      border-color: #94A3B8;
    }

    .letter-tile:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .letter-tile.used {
      opacity: 0.25;
      cursor: not-allowed;
      transform: scale(0.9);
      pointer-events: none;
    }

    /* 動作按鈕群 */
    .action-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: #E2E8F0;
      color: #475569;
    }

    .btn-primary {
      background: var(--green);
      color: white;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.4);
    }

    /* =========================================
       模式 2: 音素切片與魔法合成鍋 (Word Blender)
       ========================================= */
    .blender-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .blender-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .chunk-box {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 16px 24px;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--purple);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
      transition: all 0.2s;
    }

    .chunk-box:hover {
      transform: scale(1.08);
      border-color: var(--purple);
      background: #FAF5FF;
    }

    .chunk-tag {
      font-size: 0.9rem;
      color: #94A3B8;
      font-weight: 600;
      margin-top: 4px;
    }

    .blend-symbol {
      font-size: 2rem;
      color: #CBD5E1;
      font-weight: 900;
    }

    .blend-result-box {
      background: linear-gradient(135deg, #FEF08A 0%, #FDE047 100%);
      border-radius: 24px;
      padding: 16px 36px;
      font-size: 3rem;
      font-weight: 900;
      color: #713F12;
      box-shadow: 0 8px 24px rgba(253, 224, 71, 0.4);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    /* 魔法鍋家族切換 */
    .family-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* =========================================
       模式 3: 互動英語小夥伴 Toby (Magic Talk)
       ========================================= */
    .talk-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .character-avatar {
      font-size: 5rem;
      width: 120px;
      height: 120px;
      background: #E0F2FE;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 5px solid #BAE6FD;
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
      animation: bob 3s infinite ease-in-out;
      cursor: pointer;
    }

    .speech-bubble {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 28px;
      padding: 24px 32px;
      position: relative;
      max-width: 600px;
      width: 100%;
      text-align: left;
      box-shadow: var(--shadow);
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 16px solid #E2E8F0;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 14px solid #F8FAFC;
    }

    .dialogue-en {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      line-height: 1.4;
    }

    .dialogue-zh {
      font-size: 1.1rem;
      color: #64748B;
      margin-top: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 680px;
      margin-top: 10px;
    }

    .talk-option {
      background: white;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 16px 20px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1E293B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .talk-option:hover {
      border-color: var(--secondary);
      background: #F0FDFA;
      transform: translateY(-3px) scale(1.02);
    }

    .talk-option.correct {
      border-color: var(--green);
      background: #DCFCE7;
      color: #166534;
    }

    /* 勝利慶祝 Overlay */
    .celebration-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-content {
      background: white;
      border-radius: 32px;
      padding: 40px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-emoji {
      font-size: 5rem;
      margin-bottom: 12px;
      animation: spin 1s ease;
    }

    .modal-title {
      font-size: 2rem;
      color: #0F172A;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 1.2rem;
      color: #64748B;
      margin-bottom: 24px;
    }

    /* 動畫效果 */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(253, 224, 71, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 12px 30px rgba(253, 224, 71, 0.7); }
    }

    @keyframes spin {
      0% { transform: rotate(-20deg) scale(0.8); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* 響應式微調 */
    @media (max-width: 600px) {
      .brand-title { font-size: 1.1rem; }
      .tab-btn { font-size: 0.95rem; padding: 10px 8px; }
      .slot { width: 60px; height: 70px; font-size: 2.2rem; }
      .letter-tile { width: 54px; height: 60px; font-size: 1.8rem; }
      .target-image-display { font-size: 4.8rem; }
      .dialogue-en { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- 頂部資訊列 -->
  <header>
    <div class="brand">
      <div class="brand-icon">🦁</div>
      <div>
        <div class="brand-title">Phonics & Talk Adventure</div>
        <small style="color: #64748B; font-weight: 600;">兒童互動發音與會話島</small>
      </div>
    </div>
    <div class="score-board">
      <div class="star-counter" id="starBadge">
        <span>⭐</span>
        <span id="starCount">0</span>
      </div>
    </div>
  </header>

  <!-- 模式導航標籤 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('builder')">
      <span>🔤</span>
      <span>拼字大冒險</span>
    </button>
    <button class="tab-btn" onclick="switchTab('blender')">
      <span>🥣</span>
      <span>發音魔法鍋</span>
    </button>
    <button class="tab-btn" onclick="switchTab('talk')">
      <span>🐻</span>
      <span>Toby 英語對話</span>
    </button>
  </div>

  <!-- 主要冒險舞台 -->
  <main>

    <!-- 1. 自然發音拼字挑戰 -->
    <section id="panel-builder" class="panel active">
      <div class="game-card">
        <!-- 類別切換 -->
        <div class="level-select" id="familyChips">
          <!-- 動態生成或預設 -->
        </div>

        <!-- 挑戰目標圖案 -->
        <div class="target-image-display" id="targetEmoji" onclick="playTargetWordSound()" title="點我聽單字發音">
          🐱
        </div>

        <div class="phonics-hint">
          <span>點擊聽發音：</span>
          <button class="sound-btn" onclick="playTargetWordSound()" title="朗讀整詞">🔊</button>
          <button class="sound-btn" style="background:#E0F2FE; color:#0284C7;" onclick="spellOutPhonics()" title="拆解自然發音">🧩</button>
        </div>

        <!-- 拼字卡槽 -->
        <div class="spell-slots" id="slotsContainer">
          <!-- 動態卡槽 -->
        </div>

        <!-- 字母積木選擇區 -->
        <div class="letter-blocks" id="letterPool">
          <!-- 動態字母按鈕 -->
        </div>

        <!-- 功能列 -->
        <div class="action-row">
          <button class="btn btn-secondary" onclick="resetCurrentWord()">🔄 重置</button>
          <button class="btn btn-primary" onclick="nextPhonicsWord()">下一題 ➔</button>
        </div>
      </div>
    </section>

    <!-- 2. 音素切片與魔法合成鍋 -->
    <section id="panel-blender" class="panel">
      <div class="game-card">
        <h2 style="font-size: 1.8rem; margin-bottom: 8px; color: #475569;">🥣 自然發音拼讀魔法鍋 (Blending)</h2>
        <p style="color: #64748B; margin-bottom: 20px;">點擊音素積木聽發音，再點金色魔法鍋將聲音「黏」在一起！</p>

        <!-- 韻尾家族選擇 -->
        <div class="family-tags" id="blenderFamilyTags">
          <!-- 家族選項 -->
        </div>

        <div class="blender-container">
          <div class="blender-stage">
            <!-- 首音 Onset -->
            <div class="chunk-box" id="onsetBox" onclick="playChunk('onset')">
              <span id="onsetText">c</span>
              <span class="chunk-tag">首音 (Onset)</span>
            </div>

            <div class="blend-symbol">+</div>

            <!-- 韻尾 Rime -->
            <div class="chunk-box" id="rimeBox" onclick="playChunk('rime')">
              <span id="rimeText">at</span>
              <span class="chunk-tag">韻尾 (Rime)</span>
            </div>

            <div class="blend-symbol">=</div>

            <!-- 合成詞 -->
            <div class="blend-result-box" onclick="playBlendedSound()" title="點我魔法合成！">
              <span id="blendedEmoji">🐱</span>
              <span id="blendedWord">cat</span>
              <span style="font-size: 1.5rem;">🪄</span>
            </div>
          </div>

          <!-- 快速切換聲母積木 -->
          <div style="margin-top: 10px;">
            <p style="font-size: 1rem; color: #94A3B8; margin-bottom: 10px; font-weight: 700;">換一個字母拼拼看：</p>
            <div class="letter-blocks" id="onsetCandidates"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. Toby 互動英語小夥伴 (Dialogue) -->
    <section id="panel-talk" class="panel">
      <div class="game-card">
        <div class="talk-container">
          <!-- 角色 Toby -->
          <div class="character-avatar" id="tobyAvatar" onclick="playTobyVoice()">
            🐻
          </div>

          <!-- 對話框 -->
          <div class="speech-bubble">
            <div class="dialogue-en">
              <span id="tobySpeechEn">"Hello! What's your name?"</span>
              <button class="sound-btn" onclick="playTobyVoice()" title="重播 Toby 發音">🔊</button>
            </div>
            <div class="dialogue-zh" id="tobySpeechZh">「嗨！你叫什麼名字呢？」</div>
          </div>

          <p style="font-size: 1.1rem; color: #64748B; font-weight: 700; margin-top: 8px;">
            👇 選一個回答來跟 Toby 聊天吧！
          </p>

          <!-- 互動選項卡 -->
          <div class="options-grid" id="talkOptionsGrid">
            <!-- 對話選項按鈕 -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 彈跳獎勵視窗 -->
  <div class="celebration-modal" id="rewardModal">
    <div class="modal-content">
      <div class="modal-emoji">🎉</div>
      <div class="modal-title">太棒了！Super Star!</div>
      <div class="modal-desc" id="rewardDesc">你學會拼出了 CAT！+1 顆金色星星！</div>
      <button class="btn btn-primary" style="margin: 0 auto;" onclick="closeModalAndContinue()">繼續闖關 🚀</button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. 音效引擎 (Web Audio API - 無需外部素材，離線可用)
       ========================================================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundLetterClick() {
      playTone(480, 'triangle', 0.08, 0.15);
    }

    function soundSuccess() {
      // 歡樂三連和弦
      setTimeout(() => playTone(523.25, 'sine', 0.12, 0.15), 0);
      setTimeout(() => playTone(659.25, 'sine', 0.12, 0.15), 100);
      setTimeout(() => playTone(783.99, 'sine', 0.25, 0.2), 200);
      setTimeout(() => playTone(1046.50, 'sine', 0.35, 0.2), 300);
    }

    function soundCheer() {
      const freqs = [440, 554, 659, 880];
      freqs.forEach((f, i) => {
        setTimeout(() => playTone(f, 'triangle', 0.18, 0.12), i * 80);
      });
    }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      utterance.pitch = pitch;
      window.speechSynthesis.speak(utterance);
    }

    /* =========================================================
       4. 全域狀態管理
       ========================================================= */
    let stars = 0;
    let currentCategoryIdx = 0;
    let currentWordIdx = 0;
    let currentSpellingSlots = [];
    let currentWordObj = null;

    // 發音鍋當前選擇
    let currentBlenderFamilyKey = '-at';
    let currentBlenderItem = null;

    // 當前對話索引
    let currentTalkIdx = 0;

    /* =========================================================
       5. 頁面初始化
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      // 讀取本地累積星星
      const savedStars = localStorage.getItem('phonics_adventure_stars');
      if (savedStars) {
        stars = parseInt(savedStars, 10) || 0;
        updateStarDisplay();
      }

      initBuilderCategoryTabs();
      loadPhonicsQuestion();

      initBlenderFamilies();

      loadTalkScenario(0);
    });

    function addStars(num = 1) {
      stars += num;
      localStorage.setItem('phonics_adventure_stars', stars);
      updateStarDisplay();
    }

    function updateStarDisplay() {
      document.getElementById('starCount').innerText = stars;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      if (tabId === 'builder') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-builder').classList.add('active');
      } else if (tabId === 'blender') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-blender').classList.add('active');
      } else if (tabId === 'talk') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('panel-talk').classList.add('active');
      }
    }

    /* =========================================================
       6. 模式一：自然發音拼字挑戰邏輯
       ========================================================= */
    function initBuilderCategoryTabs() {
      const container = document.getElementById('familyChips');
      container.innerHTML = '';
      PHONICS_DATA.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.className = `chip-btn ${idx === currentCategoryIdx ? 'active' : ''}`;
        btn.innerText = cat.category;
        btn.onclick = () => {
          currentCategoryIdx = idx;
          currentWordIdx = 0;
          initBuilderCategoryTabs();
          loadPhonicsQuestion();
        };
        container.appendChild(btn);
      });
    }

    function loadPhonicsQuestion() {
      const category = PHONICS_DATA[currentCategoryIdx];
      currentWordObj = category.words[currentWordIdx];

      document.getElementById('targetEmoji').innerText = currentWordObj.emoji;

      // 重設插槽與狀態
      currentSpellingSlots = new Array(currentWordObj.word.length).fill(null);
      renderSlots();
      renderLetterPool();

      // 自動讀一次單字提示
      setTimeout(() => {
        playTargetWordSound();
      }, 300);
    }

    function renderSlots() {
      const slotsContainer = document.getElementById('slotsContainer');
      slotsContainer.innerHTML = '';
      currentSpellingSlots.forEach((char, idx) => {
        const slot = document.createElement('div');
        slot.className = `slot ${char ? 'filled' : ''}`;
        slot.innerText = char ? char.toUpperCase() : '';
        slot.onclick = () => removeLetterFromSlot(idx);
        slotsContainer.appendChild(slot);
      });
    }

    function renderLetterPool() {
      const pool = document.getElementById('letterPool');
      pool.innerHTML = '';

      // 取得單字字母並混淆一些額外干擾字母
      const correctLetters = currentWordObj.word.split('');
      const distractors = ['b', 't', 'p', 'm', 's', 'a', 'o', 'd'];
      const extra = distractors.filter(l => !correctLetters.includes(l)).slice(0, 2);
      const allLetters = [...correctLetters, ...extra].sort(() => Math.random() - 0.5);

      allLetters.forEach((letter, idx) => {
        const tile = document.createElement('div');
        tile.className = 'letter-tile';
        tile.innerText = letter.toUpperCase();
        tile.dataset.letter = letter;
        tile.dataset.tileId = 'tile-' + idx;
        tile.onclick = () => selectLetterTile(tile, letter);
        pool.appendChild(tile);
      });
    }

    function selectLetterTile(tileElem, letter) {
      if (tileElem.classList.contains('used')) return;

      // 找到第一個空槽
      const emptyIdx = currentSpellingSlots.indexOf(null);
      if (emptyIdx === -1) return;

      soundLetterClick();
      // 念出該字母的發音
      speakText(letter, 1.0, 1.2);

      currentSpellingSlots[emptyIdx] = {
        letter: letter,
        tileElem: tileElem
      };

      tileElem.classList.add('used');
      renderSlotsFromObjects();

      checkSpelling();
    }

    function removeLetterFromSlot(slotIdx) {
      const item = currentSpellingSlots[slotIdx];
      if (!item) return;

      soundLetterClick();
      item.tileElem.classList.remove('used');
      currentSpellingSlots[slotIdx] = null;
      renderSlotsFromObjects();
    }

    function renderSlotsFromObjects() {
      const slotsContainer = document.getElementById('slotsContainer');
      const slotElems = slotsContainer.children;
      for (let i = 0; i < currentSpellingSlots.length; i++) {
        const item = currentSpellingSlots[i];
        if (item) {
          slotElems[i].className = 'slot filled';
          slotElems[i].innerText = item.letter.toUpperCase();
        } else {
          slotElems[i].className = 'slot';
          slotElems[i].innerText = '';
        }
      }
    }

    function resetCurrentWord() {
      currentSpellingSlots = new Array(currentWordObj.word.length).fill(null);
      document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('used'));
      renderSlots();
    }

    function checkSpelling() {
      // 檢查是否所有插槽都填滿
      if (currentSpellingSlots.includes(null)) return;

      const spelled = currentSpellingSlots.map(it => it.letter).join('');
      if (spelled.toLowerCase() === currentWordObj.word.toLowerCase()) {
        // 成功！
        soundSuccess();
        addStars(1);
        setTimeout(() => {
          showRewardModal(
            currentWordObj.emoji,
            `Great Job!`,
            `你正確拼出了「${currentWordObj.word.toUpperCase()}」(${currentWordObj.hint})！⭐ 獲得 1 顆冒險之星！`
          );
          speakText(`Awesome! ${currentWordObj.word}!`, 0.9);
        }, 300);
      } else {
        soundWrong();
        speakText('Try again!', 1.0);
      }
    }

    function nextPhonicsWord() {
      const category = PHONICS_DATA[currentCategoryIdx];
      currentWordIdx = (currentWordIdx + 1) % category.words.length;
      loadPhonicsQuestion();
    }

    function playTargetWordSound() {
      if (!currentWordObj) return;
      speakText(currentWordObj.word, 0.85);
    }

    function spellOutPhonics() {
      if (!currentWordObj) return;
      // 依序拆解發音：/k/ ... /æ/ ... /t/ ... cat!
      const sounds = currentWordObj.phonics;
      let delay = 0;
      sounds.forEach((char, i) => {
        setTimeout(() => {
          playTone(350 + i * 80, 'sine', 0.1, 0.12);
          speakText(char, 0.9, 1.2);
        }, delay);
        delay += 750;
      });

      setTimeout(() => {
        playTone(600, 'triangle', 0.2, 0.15);
        speakText(currentWordObj.word, 0.85);
      }, delay + 200);
    }

    /* =========================================================
       7. 模式二：發音魔法鍋 (Word Blender)
       ========================================================= */
    function initBlenderFamilies() {
      const container = document.getElementById('blenderFamilyTags');
      container.innerHTML = '';
      Object.keys(BLENDER_FAMILIES).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `chip-btn ${key === currentBlenderFamilyKey ? 'active' : ''}`;
        btn.innerText = `字族 ${key}`;
        btn.onclick = () => {
          currentBlenderFamilyKey = key;
          initBlenderFamilies();
          loadBlenderStage();
        };
        container.appendChild(btn);
      });

      loadBlenderStage();
    }

    function loadBlenderStage() {
      const fam = BLENDER_FAMILIES[currentBlenderFamilyKey];
      currentBlenderItem = fam.items[0];

      document.getElementById('rimeText').innerText = fam.rime;
      document.getElementById('onsetText').innerText = currentBlenderItem.onset;
      document.getElementById('blendedWord').innerText = currentBlenderItem.word;
      document.getElementById('blendedEmoji').innerText = currentBlenderItem.emoji;

      // 候選開頭字母
      const candidates = document.getElementById('onsetCandidates');
      candidates.innerHTML = '';
      fam.items.forEach(item => {
        const tile = document.createElement('div');
        tile.className = 'letter-tile';
        tile.style.width = '60px';
        tile.style.height = '64px';
        tile.innerText = item.onset.toUpperCase();
        tile.onclick = () => {
          soundLetterClick();
          currentBlenderItem = item;
          document.getElementById('onsetText').innerText = item.onset;
          document.getElementById('blendedWord').innerText = item.word;
          document.getElementById('blendedEmoji').innerText = item.emoji;
          speakText(item.onset, 1.0, 1.3);
        };
        candidates.appendChild(tile);
      });
    }

    function playChunk(type) {
      if (type === 'onset') {
        playTone(380, 'sine', 0.12, 0.15);
        speakText(currentBlenderItem.onset, 1.0, 1.2);
      } else {
        playTone(480, 'sine', 0.12, 0.15);
        speakText(BLENDER_FAMILIES[currentBlenderFamilyKey].rime, 0.9, 1.1);
      }
    }

    function playBlendedSound() {
      soundCheer();
      // 先念聲母，再念韻尾，再合成整詞！
      speakText(`${currentBlenderItem.onset} ... ${BLENDER_FAMILIES[currentBlenderFamilyKey].rime} ... ${currentBlenderItem.word}!`, 0.85);
      addStars(1);
    }

    /* =========================================================
       8. 模式三：Toby 互動英語對話
       ========================================================= */
    function loadTalkScenario(idx) {
      currentTalkIdx = idx % CONVERSATION_SCENARIOS.length;
      const scenario = CONVERSATION_SCENARIOS[currentTalkIdx];

      document.getElementById('tobySpeechEn').innerText = scenario.tobyEn;
      document.getElementById('tobySpeechZh').innerText = scenario.tobyZh;

      const grid = document.getElementById('talkOptionsGrid');
      grid.innerHTML = '';

      scenario.options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'talk-option';
        btn.innerHTML = `
          <span>${opt.text}</span>
          <span style="font-size: 1.2rem;">💬</span>
        `;
        btn.onclick = () => chooseTalkOption(opt, btn);
        grid.appendChild(btn);
      });

      // 朗讀 Toby 的提問
      setTimeout(() => {
        playTobyVoice();
      }, 400);
    }

    function playTobyVoice() {
      const scenario = CONVERSATION_SCENARIOS[currentTalkIdx];
      speakText(scenario.tobyEn, 0.88, 1.05);
    }

    function chooseTalkOption(option, btnElem) {
      soundLetterClick();
      btnElem.classList.add('correct');

      // 念出使用者的回答
      speakText(option.text, 0.9);

      // Toby 回應
      setTimeout(() => {
        document.getElementById('tobySpeechEn').innerText = `"${option.reply}"`;
        document.getElementById('tobySpeechZh').innerText = `「${option.replyZh}」`;
        speakText(option.reply, 0.88, 1.1);
        soundSuccess();
        addStars(1);

        // 3秒後切換下一句生活對話
        setTimeout(() => {
          loadTalkScenario(currentTalkIdx + 1);
        }, 4000);
      }, 1200);
    }

    /* =========================================================
       9. 獎勵視窗 Modal
       ========================================================= */
    function showRewardModal(emoji, title, desc) {
      document.querySelector('.modal-emoji').innerText = emoji;
      document.querySelector('.modal-title').innerText = title;
      document.getElementById('rewardDesc').innerText = desc;
      document.getElementById('rewardModal').style.display = 'flex';
    }

    function closeModalAndContinue() {
      document.getElementById('rewardModal').style.display = 'none';
      nextPhonicsWord();
    }
